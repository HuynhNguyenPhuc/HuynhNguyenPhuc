<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<circle cx="50" cy="105" r="22" fill="#e2e8f0" stroke="#94a3b8"/><text x="50" y="109" text-anchor="middle" font-size="11">noise</text>
<rect x="288" y="83" width="44" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/><text x="310" y="109" text-anchor="middle" font-size="11">data</text>
